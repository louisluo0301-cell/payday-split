[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
# Favor smaller deployment bytecode to keep PaydaySplit below the EIP-170 cap.
optimizer_runs = 25
via_ir = true
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
reactive = "https://mainnet-rpc.rnk.dev/"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 256

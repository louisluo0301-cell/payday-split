name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Foundry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes --skip test --skip script
      - run: forge test -vv
      - run: forge coverage --ir-minimum --report summary
        continue-on-error: true

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deployment environment parser
        shell: pwsh
        run: ../script/test-env.ps1
